<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10243a">
<title>日韓機票雷達</title>

<style>
*{box-sizing:border-box}
:root{
  --navy:#10243a;
  --green:#0e8d89;
  --bg:#f4f7f9;
  --card:#fff;
  --muted:#71808e;
  --line:#dce5ea;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--navy);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;
  padding-bottom:105px;
}
header{
  padding:calc(18px + env(safe-area-inset-top)) 20px 18px;
  background:#10243a;
  color:white;
}
.brand{
  font-size:21px;
  font-weight:900;
}
.brand small{
  display:block;
  opacity:.7;
  font-size:12px;
  margin-top:4px;
}
main{
  padding:18px 16px;
  max-width:700px;
  margin:auto;
}
.page{display:none}
.page.active{display:block}
h1{
  font-size:29px;
  line-height:1.18;
  margin:7px 0 8px;
}
h2{
  font-size:19px;
  margin:23px 0 10px;
}
.lead{
  color:var(--muted);
  margin:0 0 18px;
}
.card{
  background:white;
  border:1px solid var(--line);
  border-radius:19px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 5px 20px rgba(16,36,58,.05);
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:6px;
}
select,input{
  width:100%;
  border:1px solid var(--line);
  background:white;
  border-radius:13px;
  padding:12px;
  color:var(--navy);
  font-size:15px;
}
.primary{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:13px;
  background:var(--green);
  color:white;
  font-weight:900;
  font-size:16px;
}
.deal{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.route{
  font-size:18px;
  font-weight:900;
}
.meta{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}
.price{
  font-size:21px;
  font-weight:900;
  white-space:nowrap;
}
.badge{
  display:inline-block;
  margin-top:7px;
  padding:4px 8px;
  border-radius:999px;
  background:#e7f6f3;
  color:#087f72;
  font-size:11px;
  font-weight:800;
}
.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.small{
  flex:1;
  padding:10px;
  border:1px solid var(--line);
  border-radius:11px;
  background:white;
  color:var(--navy);
  font-weight:700;
}
.chips{
  display:flex;
  gap:8px;
  overflow:auto;
  margin:10px 0;
}
.chip{
  white-space:nowrap;
  padding:9px 12px;
  background:white;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--navy);
}
.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}
.notice{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:20px 5px;
}
.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:10;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);
  padding:7px 6px calc(7px + env(safe-area-inset-bottom));
}
.nav{
  border:0;
  background:transparent;
  color:#71808e;
  min-height:67px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  border-radius:15px;
  font-size:11px;
  font-weight:700;
}
.nav svg{
  width:31px;
  height:31px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.nav.active{
  color:var(--green);
  background:#edf8f6;
}
.count{
  background:var(--navy);
  color:white;
  border-radius:99px;
  padding:1px 5px;
  margin-left:2px;
}
@media(max-width:390px){
  .grid{grid-template-columns:1fr}
  .nav svg{width:30px;height:30px}
}
</style>
</head>

<body>

<header>
  <div class="brand">
    ✈ 日韓機票雷達
    <small>從台灣出發，找到值得買的日韓機票</small>
  </div>
</header>

<main>

<section id="home" class="page active">
  <h1>下一趟，<br>去哪裡最便宜？</h1>
  <p class="lead">不用先決定城市，讓價格告訴你去哪裡。</p>

  <div class="card">
    <div class="grid">

      <div>
        <label>從哪裡出發</label>
        <select>
          <option>桃園 TPE</option>
          <option>松山 TSA</option>
          <option>高雄 KHH</option>
        </select>
      </div>

      <div>
        <label>想去哪裡</label>
        <select id="homeDest">
          <option value="ALL">日韓全部</option>
          <option value="東京">東京</option>
          <option value="大阪">大阪</option>
          <option value="福岡">福岡</option>
          <option value="沖繩">沖繩</option>
          <option value="首爾">首爾</option>
          <option value="釜山">釜山</option>
        </select>
      </div>

    </div>

    <button class="primary" onclick="goSearch()">
      幫我找便宜機票
    </button>
  </div>

  <h2>🔥 今日低價雷達</h2>
  <div id="homeDeals"></div>
</section>


<section id="search" class="page">
  <h1>搜尋機票</h1>
  <p class="lead">日期越有彈性，越容易找到甜甜價。</p>

  <div class="card">
    <div class="grid">

      <div>
        <label>出發地</label>
        <select>
          <option>桃園 TPE</option>
          <option>松山 TSA</option>
          <option>高雄 KHH</option>
        </select>
      </div>

      <div>
        <label>目的地</label>
        <select id="dest">
          <option value="ALL">日韓全部</option>
          <option value="東京">東京</option>
          <option value="大阪">大阪</option>
          <option value="福岡">福岡</option>
          <option value="沖繩">沖繩</option>
          <option value="札幌">札幌</option>
          <option value="首爾">首爾</option>
          <option value="釜山">釜山</option>
          <option value="濟州">濟州</option>
        </select>
      </div>

      <div>
        <label>出發日期</label>
        <input type="date" id="date">
      </div>

      <div>
        <label>預算上限</label>
        <input type="number" id="budget" value="8000">
      </div>

    </div>

    <button class="primary" onclick="runSearch()">
      找最低價
    </button>
  </div>

  <div class="chips">
    <button class="chip" onclick="budget.value=5000;runSearch()">5,000 以下</button>
    <button class="chip" onclick="budget.value=7000;runSearch()">7,000 以下</button>
    <button class="chip" onclick="budget.value=10000;runSearch()">10,000 以下</button>
  </div>

  <h2>搜尋結果</h2>
  <div id="results"></div>
</section>


<section id="deals" class="page">
  <h1>低價</h1>
  <p class="lead">現在日韓哪裡最便宜，一次排行。</p>
  <div id="dealList"></div>
</section>


<section id="tracking" class="page">
  <h1>追蹤</h1>
  <p class="lead">把想等降價的航線放在這裡。</p>
  <div id="trackingList"></div>
</section>


<section id="favorites" class="page">
  <h1>收藏</h1>
  <p class="lead">收藏你想去的目的地。</p>
  <div id="favoriteList"></div>
</section>


<div class="notice">
  V2 Demo 測試版 · 目前票價為示範資料，尚非即時航空公司售價
</div>

</main>


<nav class="bottom">

<button class="nav active" data-page="home"
onclick="showPage('home',this)">
<svg viewBox="0 0 24 24">
  <path d="M3 10.8 12 3l9 7.8"/>
  <path d="M5.5 9.5V21h13V9.5"/>
  <path d="M9.5 21v-6h5v6"/>
</svg>
<span>首頁</span>
</button>


<button class="nav" data-page="search"
onclick="showPage('search',this)">
<svg viewBox="0 0 24 24">
  <circle cx="10.5" cy="10.5" r="6.8"/>
  <path d="m15.7 15.7 5.1 5.1"/>
</svg>
<span>搜尋</span>
</button>


<button class="nav" data-page="deals"
onclick="showPage('deals',this)">
<svg viewBox="0 0 24 24">
  <path d="M3 16.5 10.5 13l3-8 2 1-1 6 5-2.3c1.2-.5 2.3.2 1.8 1.4-.2.5-.6.9-1.1 1.2L13 17l-4.5 4-1.3-.7 2.4-4.1-5.8 2.2z"/>
</svg>
<span>低價</span>
</button>


<button class="nav" data-page="tracking"
onclick="showPage('tracking',this)">
<svg viewBox="0 0 24 24">
  <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
  <path d="M10 21h4"/>
</svg>
<span>追蹤 <b id="trackCount"></b></span>
</button>


<button class="nav" data-page="favorites"
onclick="showPage('favorites',this)">
<svg viewBox="0 0 24 24">
  <path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6z"/>
</svg>
<span>收藏 <b id="favCount"></b></span>
</button>

</nav>


<script>

const deals = [
  {city:"福岡",country:"日本",price:4280,route:"TPE → FUK",days:"4天"},
  {city:"沖繩",country:"日本",price:4680,route:"TPE → OKA",days:"4天"},
  {city:"釜山",country:"韓國",price:4980,route:"TPE → PUS",days:"5天"},
  {city:"大阪",country:"日本",price:5680,route:"TPE → KIX",days:"5天"},
  {city:"首爾",country:"韓國",price:5980,route:"TPE → ICN",days:"5天"},
  {city:"東京",country:"日本",price:6480,route:"TPE → NRT",days:"6天"},
  {city:"濟州",country:"韓國",price:6680,route:"TPE → CJU",days:"5天"},
  {city:"札幌",country:"日本",price:7980,route:"TPE → CTS",days:"6天"}
];

let favorites =
JSON.parse(localStorage.getItem("radarFavorites") || "[]");

let tracking =
JSON.parse(localStorage.getItem("radarTracking") || "[]");

const money = n =>
"NT$" + Number(n).toLocaleString("zh-TW");


function dealCard(d){

  const fav =
  favorites.some(x => x.city === d.city);

  const track =
  tracking.some(x => x.city === d.city);

  let grade = "值得關注";

  if(d.price < 5000) grade = "超級便宜";
  else if(d.price < 6000) grade = "很便宜";

  return `
  <div class="card">

    <div class="deal">

      <div>
        <div class="route">
          ${d.city} · ${d.country}
        </div>

        <div class="meta">
          ${d.route} · 來回 · ${d.days}
        </div>

        <span class="badge">
          ${grade}
        </span>
      </div>

      <div class="price">
        ${money(d.price)}
      </div>

    </div>

    <div class="actions">

      <button class="small"
      onclick="toggleTrack('${d.city}')">
        ${track ? "✓ 已追蹤" : "＋ 追蹤"}
      </button>

      <button class="small"
      onclick="toggleFav('${d.city}')">
        ${fav ? "♡ 已收藏" : "♡ 收藏"}
      </button>

    </div>

  </div>
  `;
}


function render(){

  document.querySelector("#homeDeals").innerHTML =
  deals.slice(0,3).map(dealCard).join("");

  document.querySelector("#dealList").innerHTML =
  deals.map(dealCard).join("");

  document.querySelector("#trackingList").innerHTML =
  tracking.length
  ? tracking.map(dealCard).join("")
  : empty(
      "還沒有追蹤航線",
      "到低價或搜尋頁面加入想等降價的機票。"
    );

  document.querySelector("#favoriteList").innerHTML =
  favorites.length
  ? favorites.map(dealCard).join("")
  : empty(
      "還沒有收藏",
      "看到喜歡的目的地時，按一下收藏。"
    );

  document.querySelector("#trackCount").textContent =
  tracking.length ? tracking.length : "";

  document.querySelector("#favCount").textContent =
  favorites.length ? favorites.length : "";
}


function empty(title,text){

  return `
  <div class="card empty">
    <strong>${title}</strong>
    <div class="meta">${text}</div>
  </div>
  `;
}


function toggleFav(city){

  const d =
  deals.find(x => x.city === city);

  if(
    favorites.some(x => x.city === city)
  ){

    favorites =
    favorites.filter(
      x => x.city !== city
    );

  }else{

    favorites.push(d);

  }

  localStorage.setItem(
    "radarFavorites",
    JSON.stringify(favorites)
  );

  render();
}


function toggleTrack(city){

  const d =
  deals.find(x => x.city === city);

  if(
    tracking.some(x => x.city === city)
  ){

    tracking =
    tracking.filter(
      x => x.city !== city
    );

  }else{

    tracking.push(d);

  }

  localStorage.setItem(
    "radarTracking",
    JSON.stringify(tracking)
  );

  render();
}


function showPage(id,button){

  document
  .querySelectorAll(".page")
  .forEach(
    page =>
    page.classList.remove("active")
  );

  document
  .getElementById(id)
  .classList.add("active");

  document
  .querySelectorAll(".nav")
  .forEach(
    nav =>
    nav.classList.remove("active")
  );

  const activeButton =
  button ||
  document.querySelector(
    `[data-page="${id}"]`
  );

  activeButton.classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  render();
}


function goSearch(){

  const selected =
  document.querySelector("#homeDest").value;

  document.querySelector("#dest").value =
  selected;

  showPage("search");

  runSearch();
}


function runSearch(){

  const maximum =
  Number(
    document.querySelector("#budget").value
  ) || 999999;

  const destination =
  document.querySelector("#dest").value;

  const filtered =
  deals.filter(d => {

    const priceOK =
    d.price <= maximum;

    const destinationOK =
    destination === "ALL" ||
    d.city === destination;

    return priceOK && destinationOK;

  });

  document.querySelector("#results").innerHTML =
  filtered.length
  ? filtered.map(dealCard).join("")
  : empty(
      "目前沒有符合條件",
      "提高預算或改選其他目的地再試一次。"
    );
}


const future =
new Date(
  Date.now() + 30 * 86400000
);

document.querySelector("#date").value =
future.toISOString().slice(0,10);

render();
runSearch();

</script>

</body>
</html>
